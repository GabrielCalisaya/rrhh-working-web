name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela corridas viejas de la misma rama en vez de encolarlas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22, no 20. En Node 20 los tests fallaban antes de arrancar con
          # "webidl.util.markAsUncloneable is not a function": jsdom carga undici,
          # que usa markAsUncloneable de node:worker_threads. Es también la
          # versión con la que corre Vercel, así que CI y producción quedan
          # alineados.
          node-version: 22
          cache: npm

      - run: npm ci

      # Separado del build: un error de tipos se distingue de un error de compilación.
      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholders: el build no consulta Supabase (todo se resuelve en
          # request time), pero los módulos leen las variables al construir el
          # cliente. Los valores reales van en Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          SUPABASE_STORAGE_BUCKET: cvs
